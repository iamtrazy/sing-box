name: Sync upstream and release

# Watches SagerNet/sing-box's latest STABLE release (skips alpha/beta/rc
# prereleases). When a new one appears, re-vendors the exact sing-openconnect
# commit that release pins, reapplies our two patches (patches/*.patch) on
# top of it, and tags+pushes our own release, which triggers release-fork.yml
# to build and publish binaries automatically.
on:
  schedule:
    - cron: "17 4 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (patches branch)
        uses: actions/checkout@v4
        with:
          ref: patches
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Determine latest upstream stable release
        id: upstream
        run: |
          set -euo pipefail
          TAG=$(gh api repos/SagerNet/sing-box/releases/latest -q .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable release: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine last synced base
        id: last_synced
        run: |
          set -euo pipefail
          LAST=$(git tag -l 'v*-patched.*' | sed -E 's/-patched\.[0-9]+$//' | sort -V | tail -1 || true)
          echo "tag=${LAST:-none}" >> "$GITHUB_OUTPUT"
          echo "Last synced base: ${LAST:-none}"

      - name: Stop if already up to date
        if: steps.upstream.outputs.tag == steps.last_synced.outputs.tag
        run: |
          echo "Already synced to ${{ steps.upstream.outputs.tag }}, nothing to do."
          echo "SHOULD_SYNC=false" >> "$GITHUB_ENV"

      - name: Continue flag
        if: steps.upstream.outputs.tag != steps.last_synced.outputs.tag
        run: echo "SHOULD_SYNC=true" >> "$GITHUB_ENV"

      - name: Reset working tree to upstream tag
        if: env.SHOULD_SYNC == 'true'
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch --depth 1 upstream "refs/tags/${{ steps.upstream.outputs.tag }}"
          # Overlay every file the upstream tag has onto our tree. This only
          # touches paths that exist in the upstream tree, so our own
          # additions (patches/, this workflow, release-fork.yml) are left
          # alone rather than deleted. Files upstream has since removed may
          # linger as harmless stale tracked files; acceptable trade-off for
          # keeping this step simple and safe.
          git checkout FETCH_HEAD -- .
          git add -A

      - name: Determine pinned sing-openconnect commit
        if: env.SHOULD_SYNC == 'true'
        id: pin
        run: |
          set -euo pipefail
          LINE=$(grep 'github.com/sagernet/sing-openconnect ' go.mod | head -1)
          COMMIT=$(echo "$LINE" | grep -oE '[0-9a-f]{12}$')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Pinned sing-openconnect commit: $COMMIT"

      - name: Re-vendor and patch sing-openconnect
        if: env.SHOULD_SYNC == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/soc
          git clone --quiet https://github.com/SagerNet/sing-openconnect.git /tmp/soc
          git -C /tmp/soc checkout --quiet "${{ steps.pin.outputs.commit }}"
          rm -rf thirdparty/sing-openconnect
          mkdir -p thirdparty/sing-openconnect
          rsync -a --exclude='.git' /tmp/soc/ thirdparty/sing-openconnect/
          cd thirdparty/sing-openconnect
          git apply --verbose ../../patches/sing-openconnect.patch

      - name: Reapply sing-box patch
        if: env.SHOULD_SYNC == 'true'
        run: |
          set -euo pipefail
          git apply --verbose patches/sing-box.patch
          go mod edit -replace github.com/sagernet/sing-openconnect=./thirdparty/sing-openconnect
          go mod tidy

      - name: Verify build
        if: env.SHOULD_SYNC == 'true'
        run: |
          set -euo pipefail
          go build -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect" ./cmd/sing-box

      - name: Commit and tag
        if: env.SHOULD_SYNC == 'true'
        run: |
          set -euo pipefail
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync to upstream ${{ steps.upstream.outputs.tag }}"
          VERSION="${{ steps.upstream.outputs.tag }}"
          git tag "${VERSION}-patched.1"
          git push origin patches --force
          git push origin "${VERSION}-patched.1"
